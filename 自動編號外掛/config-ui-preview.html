<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自動編號外掛 — 設定畫面預覽</title>
<!-- 開發用預覽：模擬 kintone 環境，直接以瀏覽器開啟即可檢視設定畫面外觀與互動。
     引用的是真正的 contents/ 內檔案，所以看到的畫面＝實際外掛畫面。 -->
<link rel="stylesheet" href="contents/source/css/config.css">
<style>
  .preview-banner {
    background: #1a2430; color: #e8eef4; text-align: center;
    padding: 8px 16px; font-size: 12.5px; letter-spacing: .03em;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .preview-banner b { color: #7fb2e5; }
</style>
</head>
<body>
<div class="preview-banner">預覽模式：這是設定畫面的外觀模擬，<b>按「儲存設定」不會真的寫入 kintone</b>（內容會印在 Console）。</div>

<section id="ui-section">
  <div class="anum-loading">設定畫面載入中，請稍候…</div>
</section>

<script>
// ── 模擬 kintone 環境 ──
// 預設模擬 v1.6.0 多組設定（事故編號＋東亞貨物編號）；網址加 ?legacy=1 改模擬 v1.5.0 的舊版平面設定，
// 用來檢查「舊設定讀進來會自動變成第 1 組」。
const ACCIDENT_PROFILE = {
  numberLabel: '', numberField: '事故編號', categoryField: '事故分類',
  target: 'field', subtableCode: '',
  triggers: ['process.proceed'],
  statusCond: '*', toStatus: '文件確認', actionName: '*', confirmMessage: '*',
  categories: [
    { match: '物損事故(貨物)',       counterKey: 'CA', mode: 'issue', copyField: '', validate: '' },
    { match: '物損事故(設施或其他)', counterKey: 'CA', mode: 'issue', copyField: '', validate: '' },
    { match: '搬家行李事故',         counterKey: 'HA', mode: 'issue', copyField: '', validate: '' },
    { match: '其他事故',             counterKey: 'OA', mode: 'issue', copyField: '', validate: '' },
  ],
  codeMaps: [
    { token: 'level', field: '事故級別', pairs: [{ from: '一般事故', to: 'G' }, { from: '重大事故', to: 'M' }] },
  ],
};
const TOA_PROFILE = {
  numberLabel: '', numberField: '東亞貨物編號', categoryField: '通報編號',
  target: 'field', subtableCode: '',
  triggers: ['create.submit', 'edit.submit'],
  statusCond: '*', toStatus: '*', actionName: '*', confirmMessage: '*',
  categories: [{ match: '通報物損編號', counterKey: 'TOA_CA', mode: 'issue', copyField: '', validate: '' }],
  codeMaps: [],
};
const SHARED = {
  counterApp: '715', counterToken: '', selfToken: '',
  hasCounterToken: true, hasSelfToken: false,
  activeQuery: 'active in ("啟用")', maxRetry: 5,
};
const SAVED = /[?&]legacy=1/.test(location.search)
  ? Object.assign({ version: '1.0' }, SHARED, ACCIDENT_PROFILE)
  : Object.assign({ version: '2.0' }, SHARED, { profiles: [ACCIDENT_PROFILE, TOA_PROFILE] });

// 模擬表單結構：含表單本體欄位 + 一個子表格（用來驗證逐列給號的三個選單）
const FORM_FIELDS = {
  properties: {
    '事故編號':   { code: '事故編號', label: '事故編號', type: 'SINGLE_LINE_TEXT' },
    '事故分類':   { code: '事故分類', label: '事故分類', type: 'DROP_DOWN' },
    '事故級別':   { code: '事故級別', label: '事故級別', type: 'RADIO_BUTTON' },
    '通報編號':   { code: '通報編號', label: '通報編號', type: 'DROP_DOWN' },
    '東亞貨物編號': { code: '東亞貨物編號', label: '東亞貨物編號', type: 'SINGLE_LINE_TEXT' },
    '統一編號':   { code: '統一編號', label: '統一編號', type: 'SINGLE_LINE_TEXT' },
    '客戶名稱':   { code: '客戶名稱', label: '客戶名稱', type: 'SINGLE_LINE_TEXT' },
    '申請日期':   { code: '申請日期', label: '申請日期', type: 'DATE' },
    'accident_place': { code: 'accident_place', label: '發生地點詳細地址與周邊環境描述', type: 'MULTI_LINE_TEXT' },
    '設備明細': {
      code: '設備明細', label: '設備明細表', type: 'SUBTABLE',
      fields: {
        '設備代號':   { code: '設備代號', label: '設備代號', type: 'SINGLE_LINE_TEXT' },
        '設備種類':   { code: '設備種類', label: '設備種類', type: 'DROP_DOWN' },
        '設備需求':   { code: '設備需求', label: '設備需求', type: 'DROP_DOWN' },
        '數量':       { code: '數量', label: '數量', type: 'NUMBER' },
        'item_note':  { code: 'item_note', label: '這一列的備註說明文字', type: 'MULTI_LINE_TEXT' },
      },
    },
    '費用明細': {
      code: '費用明細', label: '費用明細表', type: 'SUBTABLE',
      fields: {
        '費用項目': { code: '費用項目', label: '費用項目', type: 'SINGLE_LINE_TEXT' },
        '金額':     { code: '金額', label: '金額', type: 'NUMBER' },
      },
    },
  },
};

window.kintone = {
  $PLUGIN_ID: 'preview',
  app: { getId: () => 123 },
  api: Object.assign(
    (url, method, params) => {
      if (String(url).indexOf('/form/fields.json') !== -1) return Promise.resolve(FORM_FIELDS);
      return Promise.reject(new Error('預覽環境未模擬此 API：' + url));
    },
    { url: (p) => 'https://example.cybozu.com' + p }
  ),
  plugin: { app: {
    getConfig: () => ({ data: JSON.stringify(SAVED) }),
    getProxyConfig: () => null,
    setProxyConfig: (u, m, h, d, cb) => cb && cb(),
    setConfig: (c, cb) => {
      console.log('[預覽] 會存入的設定：', JSON.parse(c.data));
      alert('（預覽模式）設定內容已印在瀏覽器 Console，未實際寫入。');
      cb && cb();
    },
  } },
};

// 刻意包含「很長的欄位名稱」，用來檢查下拉選單是否會截斷文字
window.KintoneConfigHelper = {
  getFields: () => Promise.resolve([
    { code: '事故編號', label: '事故編號', type: 'SINGLE_LINE_TEXT' },
    { code: '事故分類', label: '事故分類', type: 'DROP_DOWN' },
    { code: '事故級別', label: '事故級別', type: 'RADIO_BUTTON' },
    { code: '統一編號', label: '統一編號', type: 'SINGLE_LINE_TEXT' },
    { code: '設備種類', label: '設備種類', type: 'DROP_DOWN' },
    { code: '發生地點詳細地址與周邊環境描述', label: '發生地點詳細地址與周邊環境描述', type: 'MULTI_LINE_TEXT' },
    { code: 'accident_handling_department_name', label: '事故處理負責部門（含代理部門）', type: 'ORGANIZATION_SELECT' },
    { code: '客戶名稱', label: '客戶名稱', type: 'SINGLE_LINE_TEXT' },
    { code: '建立時間', label: '建立時間', type: 'CREATED_TIME' },
  ]),
};
</script>
<script src="contents/dist/config.js"></script>
</body>
</html>
